#   iPhone, 2 iPad).
# - https://keith.github.io/xcode-man-pages/xcodebuild.1.html : "-scheme: Build the
#   scheme specified by schemename."; "-destination: Use the destination device
#   described by destinationspecifier." with the "generic/" prefix;
#   "-allowProvisioningUpdates: Allow xcodebuild to communicate with the Apple
#   Developer website. For automatically signed targets, xcodebuild will create and
#   update profiles, app IDs, and certificates."; "buildsetting=value: Set the build
#   setting buildsetting to value."
# - https://www.manpagez.com/man/1/codesign/ : the ad-hoc sentence quoted above.
# - apple/UEMAKit/Package.swift (WI-17), apple/scripts/build_mujoco_xcframework.sh
#   (WI-18), apple/.gitignore (WI-17), apple/README.md (WI-21): read entire.
#
# FIRST BUILD ON A MAC (this work item's acceptance; plan page, section 8, step 6).
#  1. Prerequisites: a Mac with Apple silicon; Xcode with the macOS 14 and iOS 17
#     SDKs; XcodeGen (`brew install xcodegen`; record `xcodegen --version`);
#     network access for the mlx-swift clone; apple/UEMAKit/Binaries/mujoco.xcframework
#     written by `bash apple/scripts/build_mujoco_xcframework.sh` (WI-18; without it
#     SwiftPM stops loading UEMAKit, see the WI-17 header, step 2); the app sources of
#     WI-38 (apple/UEMAMind/UEMAMindApp.swift and Views/) and WI-32 (ViewModels/)
#     present, since the app source folder below is not optional.
#  2. `cd apple && xcodegen generate` : exit code 0; apple/UEMAMind.xcodeproj exists;
#     `ls UEMAMind.xcodeproj/xcshareddata/xcschemes` lists UEMAMind-macOS.xcscheme and
#     UEMAMind-iOS.xcscheme; apple/Generated/ holds the two Info.plist files and the
#     iOS entitlements file. A "missing path" message names a source folder that is
#     not there yet (step 1).
#  3. `xcodebuild -scheme UEMAMind-macOS -destination 'platform=macOS' build` : exit
#     code 0 (the acceptance line). The first run resolves mlx-swift over the network
#     and compiles its Metal shaders. A signing error here means CODE_SIGN_IDENTITY
#     "-" did not reach the target: read the generated project's build settings.
#  4. `xcodebuild -scheme UEMAMind-macOS -destination 'platform=macOS' test` : the
#     UEMAMindTests-macOS bundle runs (WI-32's tests; an empty bundle before WI-32
#     lands runs 0 tests).
#  5. MuJoCo inside the signed binary: with APP the path xcodebuild printed for
#     UEMAMind-macOS.app, `nm -gU "APP/Contents/MacOS/UEMAMind-macOS" | grep -c ' T _mj_'`
#     prints a count of at least 1 on a Debug build (MuJoCo's exported functions
#     start with mj_; UEMAPhysics (WI-25) calls mj_step through CMuJoCo (WI-19)),
#     and `codesign -dv --verbose=2 "APP"`
#     prints "Signature=adhoc" for the ad-hoc identity. Record both lines.
#  6. `xcodebuild -scheme UEMAMind-iOS -destination 'generic/platform=iOS'
#     -allowProvisioningUpdates DEVELOPMENT_TEAM=<10-character team id> build` : exit
#     code 0 (plan page, section 8, step 8; a team is required). Without a team the
#     build stops at signing; a compile-only check without signing, if wanted, needs
#     an xcodebuild build-setting override that this file does not verify.
#  7. Write each step's command, exit code and clock time (AM/PM Pacific) into
#     apple/FIRST_BUILD_RECORD.md (WI-41).

name: UEMAMind

options:
  # Prefix of every PRODUCT_BUNDLE_IDENTIFIER (see BUNDLE IDENTIFIERS above).
  bundleIdPrefix: org.uema
  # Project-wide floors; each target repeats its own below.
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  # One Xcode group per folder under apple/UEMAMind (Views, ViewModels, Tests).
  createIntermediateGroups: true

packages:
  # The local Swift package of WI-17; the path is relative to this file's folder.
  UEMAKit:
    path: UEMAKit

settings:
  base:
    # Swift 5 language mode (see SWIFT LANGUAGE MODE above).
    SWIFT_VERSION: "5.0"

targets:
  # ------------------------------------------------------------------ macOS app
  UEMAMind-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # Everything under apple/UEMAMind except the test folder of the bundles below.
      - path: UEMAMind
        excludes:
          - "Tests/**"
    dependencies:
      # UEMAKit's one library product, declared in apple/UEMAKit/Package.swift.
      - package: UEMAKit
        product: UEMAKit
    info:
      path: Generated/UEMAMind-macOS/Info.plist
      properties:
        CFBundleDisplayName: UEMA Mind
        # Xcode substitutes the build setting when it copies the Info.plist.
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc signature: no developer team needed for a local build and run.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
    scheme:
      # Writes the scheme UEMAMind-macOS; the test bundle is built for testing only.
      testTargets:
        - UEMAMindTests-macOS
      gatherCoverageData: false

  UEMAMindTests-macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # WI-32's tests; optional so that generation passes before the folder exists.
      - path: UEMAMind/Tests
        optional: true
    dependencies:
      # The host app: XcodeGen sets TEST_HOST from it; the preset sets BUNDLE_LOADER.
      - target: UEMAMind-macOS
      - package: UEMAKit
        product: UEMAKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  # -------------------------------------------------------------------- iOS app
  UEMAMind-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UEMAMind
        excludes:
          - "Tests/**"
    dependencies:
      - package: UEMAKit
        product: UEMAKit
    info:
      path: Generated/UEMAMind-iOS/Info.plist
      properties:
        CFBundleDisplayName: UEMA Mind
        # A launch screen without a storyboard: the empty dictionary takes the
        # system defaults (UILaunchScreen page).
        UILaunchScreen: {}
        # One scene: the app runs one body in one world (RunViewModel, WI-32).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Generated/UEMAMind-iOS/UEMAMind-iOS.entitlements
      properties:
        # REQ-B-15: the peak footprint is read with this entitlement.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # 1 = iPhone, 2 = iPad (Build settings reference, TARGETED_DEVICE_FAMILY).
        TARGETED_DEVICE_FAMILY: "1,2"
        # DEVELOPMENT_TEAM: set here or on the xcodebuild line (step 6 above).
    scheme:
      testTargets:
        - UEMAMindTests-iOS
      gatherCoverageData: false

  UEMAMindTests-iOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UEMAMind/Tests
        optional: true
    dependencies:
      - target: UEMAMind-iOS
      - package: UEMAKit
        product: UEMAKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
