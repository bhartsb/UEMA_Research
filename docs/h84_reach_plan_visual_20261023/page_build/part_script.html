<script src="h84_reach_plan_visual_20261023/plan_pictures.js"></script><script>
(()=>{const P='h84_reach_plan_visual_20261023/',N=window.H84_PLAN,f1=x=>x.toFixed(1),f2=x=>x.toFixed(2),gr=g=>g.min===g.max?g.min+'&deg;':g.min+'&deg; to '+g.max+'&deg;';document.getElementById('seqgrav').innerHTML=gr(N.sequence_grav);document.getElementById('b5grav').innerHTML=gr(N.b5strip_grav);
const t=`<figure class="tframe"><img src="${P}seq_b1_target.png" alt="body 1's target, same crop"><figcaption><strong>T</strong> (model step ${N.target_step_body1.toLocaleString()}), same crop as the strip below</figcaption></figure>`;
document.getElementById('tframe').innerHTML=t;document.getElementById('strip').innerHTML=N.sequence.map(f=>{const babble=f.what.indexOf('babble')>=0;return `<figure class="${babble?'babble':(f.what.indexOf('no noise')>=0?'nonoise':'')}"><img src="${P}seq_b1_${f.step}.png" alt="body 1 at model step ${f.step}"><figcaption><strong>${f.what.replace('end of ','After ').replace('before the first command','The start, before planner command 1')}</strong> (model step ${f.step.toLocaleString()})<br>left ${f1(f.L)} cm, right ${f1(f.R)} cm</figcaption></figure>`}).join('');
const B=N.baseline,b5=B['5'];
document.getElementById('b5strip').innerHTML=[['T','T',null],['start','Start','0'],['D5','Direct command, 250 ms','5'],['D20','Direct command, 1 s','20'],['D60','Direct command, 3 s','60'],['P60','Planner command, 3 s','60']].map(([k,lab,at])=>{if(k==='T')return `<figure><img src="${P}base_b5_T.png" alt="${lab}"><figcaption><strong>${lab}.</strong> The orange rings sit on the green squares.</figcaption></figure>`;const a=k[0]==='P'?b5.at.P[at]:b5.at.D[at];return `<figure class="${k==='D60'?'win':''}"><img src="${P}base_b5_${k}.png" alt="${lab}"><figcaption><strong>${lab}.</strong> Gap: left ${f1(a.L)} cm, right ${f1(a.R)} cm; pose error ${f1(a.E)}.</figcaption></figure>`}).join('');
document.getElementById('basegrid').innerHTML=Object.keys(B).filter(b=>b!=='5').map(b=>{const v=B[b],d=v.at.D,p=v.at.P,win=v.flags.D.both.arrived&&v.flags.D.both.stayed;return `<div class="grid g2" style="margin-bottom:14px"><figure><img src="${P}base_b${b}_start.png" alt="body ${b} start"><figcaption><strong>Body ${b}, start</strong> (gravity ${gr(v.grav)} from the line of sight in this row). Gap: left ${f1(d['0'].L)} cm, right ${f1(d['0'].R)} cm.</figcaption></figure><figure><img src="${P}base_b${b}_T.png" alt="body ${b} target"><figcaption><strong>T</strong>.</figcaption></figure><figure class="${win?'win':''}"><img src="${P}base_b${b}_D60.png" alt="body ${b} direct command at 3 s"><figcaption><strong>Direct command, 3 s.</strong> Gap: left ${f1(d['60'].L)} cm, right ${f1(d['60'].R)} cm${win?' (both hands arrived and stayed)':''}.</figcaption></figure><figure><img src="${P}base_b${b}_P60.png" alt="body ${b} planner command at 3 s"><figcaption><strong>Planner command, 3 s.</strong> Gap: left ${f1(p['60'].L)} cm, right ${f1(p['60'].R)} cm.</figcaption></figure></div>`}).join('');
})();
</script></body></html>
