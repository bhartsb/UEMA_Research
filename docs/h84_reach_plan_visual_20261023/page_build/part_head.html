<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How MIMo will reach the target</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#183044;font:18px/1.5 system-ui,sans-serif}main{max-width:1240px;margin:auto;background:white;padding:30px 40px}h1{font-size:2.1rem;line-height:1.15;margin:8px 0 14px}h2{font-size:1.45rem;line-height:1.25;margin:0 0 10px}h3{font-size:1.15rem;margin:22px 0 8px}section{border-top:2px solid #d5e0e6;padding:24px 0;scroll-margin-top:12px}p{margin:10px 0 14px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;font-weight:bold;color:#1765ba}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.strip figure{margin:0}.strip figcaption{font-size:.8rem}.babble img{border:3px solid #c34b11}.tframe img{border:3px solid #08783e}.win img{border:3px solid #08783e}
.key{font-size:.95rem;background:#f3f7fa;border-left:5px solid #1765ba;padding:12px 16px;margin:12px 0}.verdict{font-size:1.05rem;font-weight:600;background:#edf8f1;border-left:5px solid #08783e;padding:12px 16px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{padding:8px 10px;border-bottom:1px solid #d2dee6;text-align:left;vertical-align:top}th{background:#eaf1f5}.table-scroll{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.diagram{overflow-x:auto}.diagram svg{min-width:900px;display:block}svg.tl{width:100%;height:auto;display:block;min-width:700px}.tlwrap{overflow-x:auto}nav{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 4px;font-size:.9rem}a{color:#125793}p,li,figcaption{overflow-wrap:anywhere}td{overflow-wrap:normal}li{margin:6px 0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.8rem;font-weight:700;color:#fff;vertical-align:middle}.b1{background:#c34b11}.b2{background:#1765ba}.b3{background:#7a3fb0}
